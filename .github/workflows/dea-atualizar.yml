# Atualização do Painel DEA ("Exercícios Anteriores") — SÓ MANUAL.
#
# Não há agendamento: o administrador dispara pelo botão "Atualizar" do painel
# (POST /api/dea {acao:'atualizar'} → API workflow_dispatch, com o token
# DEA_GITHUB_TOKEN configurado na Vercel) ou, em último caso, pelo "Run workflow"
# desta página no GitHub.
#
# Substitui o cron do servidor previsto no pacote (dea/LEIA-PRIMEIRO.md): o site
# roda na Vercel, sem disco nem Python. O atualizar.py e o build_data.py
# rodam SEM alteração; o estado e o dados.js vivem no bucket PRIVADO do Supabase
# (dea/supabase_sync.py faz a ponte).
#
# Secrets do repositório (Settings → Secrets and variables → Actions):
#   DEA_GOOGLE_CREDENCIAL_JSON   conteúdo do JSON da conta de serviço do Google
#   SUPABASE_URL                 https://<projeto>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service_role (secreta)
#
# NUNCA rode dois pipelines ao mesmo tempo (histórico bifurca): o `concurrency`
# abaixo enfileira disparos simultâneos, e o /api/dea recusa um novo disparo
# enquanto houver execução em andamento.
name: Painel DEA — atualização

on:
  workflow_dispatch:
    inputs:
      permitir_sem_estado:
        description: 'Rodar SEM snapshot/histórico (apaga a memória do painel). Só no ponto de partida.'
        type: boolean
        default: false

concurrency:
  group: dea-atualizar
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEA_BASE: /tmp/dea
      DEA_WEB: /tmp/dea/web
      DEA_GOOGLE_CREDENCIAL: /tmp/dea/credencial.json
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Dependências
        run: pip install --disable-pip-version-check -q google-api-python-client google-auth openpyxl

      - name: Preparar diretórios e credencial
        env:
          CREDENCIAL_JSON: ${{ secrets.DEA_GOOGLE_CREDENCIAL_JSON }}
        run: |
          mkdir -p "$DEA_BASE/app" "$DEA_WEB"
          cp dea/app/build_data.py dea/app/drive_download.py dea/app/atualizar.py "$DEA_BASE/app/"
          umask 077
          printf '%s' "$CREDENCIAL_JSON" > "$DEA_GOOGLE_CREDENCIAL"
          test -s "$DEA_GOOGLE_CREDENCIAL" || { echo "Secret DEA_GOOGLE_CREDENCIAL_JSON ausente."; exit 1; }

      - name: Baixar estado do bucket privado
        run: |
          if [ "${{ inputs.permitir_sem_estado }}" = "true" ]; then
            python dea/supabase_sync.py baixar --permitir-sem-estado
          else
            python dea/supabase_sync.py baixar
          fi

      - name: Atualizar (atualizar.py do pacote, intocado)
        run: python "$DEA_BASE/app/atualizar.py"

      - name: Publicar dados.js e promover estado
        run: python dea/supabase_sync.py enviar

      - name: Limpar credencial
        if: always()
        run: rm -f "$DEA_GOOGLE_CREDENCIAL"
